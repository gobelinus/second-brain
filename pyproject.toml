[project]
name = "brain"
version = "0.1.0"
description = "Local personal second brain — private, queryable, version controlled"
requires-python = ">=3.13"

dependencies = [
    "chromadb>=1.5.1",
    "llama-index>=0.14.15",
    "ollama>=0.6.1",
    "pyyaml>=6.0.3",
    "typer>=0.24.0",
]

[project.scripts]
brain = "brain.cli:app"        # ← lets you run `brain ingest` instead of `python cli.py ingest`

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[dependency-groups]
dev= [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 88
