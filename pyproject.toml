[project]
name = "brain"
version = "0.1.0"
description = "Local personal second brain — private, queryable, version controlled"
requires-python = ">=3.13"

dependencies = [
    "chromadb>=1.5.1",
    "llama-index>=0.14.15",
    "ollama>=0.6.1",
    "plotly>=6.5.2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "streamlit>=1.54.0",
    "typer>=0.24.0",
]

[project.scripts]
brain = "brain.cli:app"        # ← lets you run `brain ingest` instead of `python cli.py ingest`

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[dependency-groups]
dev= [
    "ruff",
    "pytest",
    "pre-commit>=4.5.1",
    "detect-secrets>=1.5.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long — ruff format handles this
]

[tool.ruff.lint.isort]
known-first-party = ["brain"]
