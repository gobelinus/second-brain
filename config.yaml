ollama:
  base_url: "http://localhost:11434"
  llm_model: "mistral"
  embed_model: "nomic-embed-text"

paths:
  public_daily: "daily/public"
  sensitive_daily: "daily/sensitive"
  public_exports: "exports/public"
  sensitive_exports: "exports/sensitive"
  chroma_store: "store/chroma"
  sqlite_db: "store/brain.db"

ingestion:
  chunk_size: 500
  chunk_overlap: 50

metadata:
  sentiment_options:
    - productive
    - frustrated
    - neutral
    - overwhelmed
    - energized
