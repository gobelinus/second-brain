# =============================================================================
# Brain Project — config.yaml
# All settings live here. No hardcoded values in source code.
# Machine-specific overrides: config.local.yaml (git ignored)
# Secrets: .env (git ignored)
# =============================================================================

# -----------------------------------------------------------------------------
# Paths — all relative to project root
# -----------------------------------------------------------------------------
paths:
  daily_public: "daily/public"
  daily_sensitive: "daily/sensitive"
  inputs: "inputs"
  inputs_archive: "inputs/archive"
  exports_public: "exports/public"
  exports_sensitive: "exports/sensitive"
  exports_reminders: "exports/reminders"
  store_chroma: "store/chroma"
  store_sqlite: "store/brain.db"
  launchd: "launchd"
  todo_txt: "todo.txt"                  # rolling todo.txt at project root
  exports_todos: "exports/todos"        # git ignored, dated per-day backups (future)
  blogs_public: "blogs/public"
  blogs_sensitive: "blogs/sensitive"

# -----------------------------------------------------------------------------
# Ollama / LLM settings
# -----------------------------------------------------------------------------
ollama:
  base_url: "http://localhost:11434"
  llm_model: "mistral:latest"
  embed_model: "nomic-embed-text"
  temperature: 0          # deterministic for structured extraction
  timeout_seconds: 120

# -----------------------------------------------------------------------------
# ChromaDB settings
# -----------------------------------------------------------------------------
chroma:
  collections:
    public: "brain_public"
    sensitive: "brain_sensitive"
    blog_public: "blog_public"
    blog_sensitive: "blog_sensitive"

# -----------------------------------------------------------------------------
# Ingestion / chunking settings
# -----------------------------------------------------------------------------
ingest:
  chunk_size_words: 500
  chunk_overlap_words: 50
  default_sensitivity: "public"

# -----------------------------------------------------------------------------
# Structured metadata — enforced sentiment values
# -----------------------------------------------------------------------------
metadata:
  valid_sentiments:
    - productive
    - frustrated
    - neutral
    - overwhelmed
    - energized
  default_sentiment: "neutral"

# -----------------------------------------------------------------------------
# Exporter settings
# -----------------------------------------------------------------------------
exporter:
  date_format: "%Y-%m-%d"
  filename_collision_max: 99

# -----------------------------------------------------------------------------
# Scanner — config-driven public summary safety check
#
# Evaluation order (enforced by scan_public_summaries.py):
#   1. allowlist  → if match → SKIP (safe, stop checking)
#   2. private_domains → if match → BLOCK (severity: critical)
#   3. blocklist  → if match → check severity:
#        critical / high  → BLOCK commit
#        warning          → LOG only, allow commit
# -----------------------------------------------------------------------------
scanner:
  # Patterns that are explicitly safe — checked FIRST, stop further checks.
  # Use these for technical terms that look like domains but aren't sensitive.
  allowlist:
    - "localhost"
    - "127.0.0.1"
    - "example.com"
    - "github.com"
    - "pypi.org"
    - "ollama.ai"
    - "chromadb.com"

  # Private domains — always CRITICAL, always block commit.
  # Replace these placeholders with your actual internal domains.
  private_domains:
    - pattern: "corp\\.internal"
      description: "Internal corporate domain"
    - pattern: "company\\.slack\\.com"
      description: "Internal Slack workspace"
    - pattern: "internal\\.atlassian\\.net"
      description: "Internal Jira/Confluence"
    - pattern: "[a-z0-9-]+\\.corp\\.[a-z]+"
      description: "Generic corp subdomain pattern"

  # Blocklist — ordered list of patterns with severity levels.
  # severity: critical | high | warning
  blocklist:
    - pattern: "\\b\\d{3}[-.]\\d{3}[-.]\\d{4}\\b"
      description: "Phone number pattern"
      severity: "critical"

    - pattern: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b"
      description: "Email address"
      severity: "critical"

    - pattern: "password\\s*[:=]"
      description: "Inline password assignment"
      severity: "critical"

    - pattern: "api[_-]?key\\s*[:=]"
      description: "API key assignment"
      severity: "critical"

    - pattern: "\\bconfidential\\b"
      description: "Confidential label"
      severity: "high"
      note: "Review before committing to public"

    - pattern: "\\bproprietary\\b"
      description: "Proprietary label"
      severity: "high"

    - pattern: "\\bsalary\\b|\\bcompensation\\b|\\bbonus\\b"
      description: "Compensation terms"
      severity: "high"

    - pattern: "\\bperformance review\\b|\\bPIP\\b"
      description: "HR / performance process terms"
      severity: "warning"

# -----------------------------------------------------------------------------
# Composer — daily summary combiner
#
# brain compose --date YYYY-MM-DD [--ingest]
#   1. Reads all files from inputs/YYYY-MM-DD/
#   2. Combines via LLM into structured sensitive summary
#   3. Extracts action items into todo.txt (todo.txt format)
#   4. Writes to daily/sensitive/YYYY-MM-DD.md
#   5. Archives inputs to inputs/archive/YYYY-MM-DD/
#   6. Optionally triggers brain ingest --sensitivity sensitive
# -----------------------------------------------------------------------------
composer:
  # Output always goes to daily/sensitive/ — composer output is always sensitive
  output_sensitivity: "sensitive"

  # Supported input file extensions (others are ignored)
  input_extensions:
    - ".md"
    - ".txt"

  # Archive processed inputs after successful compose
  archive_after_compose: true

  # LLM prompt template — {date} and {content} are injected at runtime
  prompt_template: |
    IMPORTANT: Your response MUST start with exactly this line:
    # Daily Summary — {date} (Sensitive)

    Do not write any preamble, explanation, or prose before this header.
    Start your response with the # heading immediately.

    You are a personal knowledge assistant. You will receive one or more daily
    notes files for {date}. One file is a structured AI-generated daily summary.
    Other files may include meeting notes, standup notes, or ad-hoc notes.

    Your job is to MERGE all sources into a single enriched summary.
    - The AI summary is the base — preserve all its content
    - Supplementary files (meeting notes etc) should ENRICH the base:
      merge their Key Takeaways, action context, and decisions into the
      appropriate sections
    - Do not duplicate content that already exists in the AI summary
    - Do not lose content that only appears in supplementary files

    Output EXACTLY this structure:
    # Daily Summary — {date} (Sensitive)

    ## Focus Areas
    [Bullet list of main focus areas — merged from all sources]

    ## Projects
    [Bullet list of projects worked on — merged from all sources]

    ## Key Takeaways
    [Bullet list of the most important insights, decisions, and observations
     from today — merged from ALL sources including meeting notes]

    ## Meetings
    [Bullet list of meetings attended with brief context]

    ## Blockers
    [Bullet list of concrete blockers. Write "None" if none.]

    ## People / Teams
    [Bullet list of people or teams interacted with]

    ## Mood
    [Single word — MUST be one of: productive, frustrated, neutral, overwhelmed, energized]
    [One sentence explaining why]

    ## References
    [Real URLs and ticket numbers only — Jira, Confluence, PRs, Slack threads.
     Do NOT include file names, tool notices, or "meeting assets ready" messages.]

    ---
    SOURCE NOTES:
    {content}

    Rules:
    - Preserve all technical details, ticket numbers, and names exactly
    - Key Takeaways must include insights from meeting notes files — do not skip them
    - Merge duplicate information — do not repeat the same point twice
    - Ignore file metadata lines and tool-generated footers in References
    - Output only the markdown. No preamble, no commentary.

  # todo.txt extraction prompt — {date} and {content} are injected at runtime
  todo_prompt_template: |
    You are a precise action item extractor. Extract all action items from the
    following daily notes for {date} and format them in todo.txt format.

    todo.txt format rules:
    - One action item per line
    - Start with priority: (A), (B), or (C)
        (A) = urgent / blocking / due today
        (B) = important / should be done soon
        (C) = nice to have / low urgency
    - Follow with creation date: {date}
    - Then the action item description
    - Add +Project tag if a project is identifiable (no spaces, CamelCase)
    - Add @context tag for context: @infra @team @review @comms @code
    - Append a stable ID tag: id:XXXXXXXX
        Generate the ID as the first 8 characters of the SHA-1 hash of the
        action item description text (lowercase, strip punctuation first).
        This makes IDs deterministic — re-extracting the same item gives
        the same ID every time.
    - If a Jira ticket is mentioned in the notes for this item, append: jira:TICKET-123
    - If a Confluence page is referenced for this item, append: conf:page-slug

    Example output:
    (A) {date} Fix hotfix approval request for kkumar +Anvil @review id:3a9f2b1c jira:PLAT-1234
    (B) {date} Reduce Prod0 instances to 20 and monitor performance +Autoscaling @infra id:7c4e8d2a
    (C) {date} Post daily auto-scaling summary to channel +Autoscaling @comms id:b1f93e55

    Rules:
    - Extract ONLY concrete action items — things someone must DO
    - Do not extract observations, decisions, or status updates
    - Do not invent items not present in the notes
    - Every item MUST have an id: tag — never omit it
    - Only add jira:/conf: tags if the ticket or page is explicitly mentioned
    - Output ONLY the todo.txt lines. No preamble, no headers, no commentary.

    SOURCE NOTES:
    {content}

# -----------------------------------------------------------------------------
# Blog Structurer — LLM metadata extraction for blog posts
#
# brain ingest --file blogs/public/my-post.md   (auto-detected as blog)
# brain ingest --file blogs/sensitive/draft.md  (auto-detected as blog)
#
# ChromaDB only — no SQLite storage for blog posts.
# Collections: blog_public / blog_sensitive (separate from daily summaries)
# -----------------------------------------------------------------------------
blog:
  # Chunk size — same as daily summaries
  chunk_size_words: 500
  chunk_overlap_words: 50

  # LLM prompt for extracting blog metadata
  # Placeholders injected at runtime: {content}
  extraction_prompt: |
    You are a precise metadata extractor for blog posts written in markdown.
    Analyze the blog post below and extract structured metadata.
    Respond ONLY with a valid JSON object — no explanation, no markdown fences,
    no extra text.

    Required JSON schema:
    {{
        "title": "the blog post title — extract from H1 heading or first heading",
        "slug": "url-friendly version of title — lowercase, hyphens, no special chars",
        "date": "publication or creation date if mentioned, else null — format YYYY-MM-DD",
        "tags": ["list of topic tags — infer from content if not explicit"],
        "status": "one of: draft, published, internal — infer from content context",
        "url": "external published URL if mentioned in the post, else null"
    }}

    Rules:
    - title: use the H1 heading. If no H1, use the first heading found.
    - slug: derive from title only — lowercase, replace spaces with hyphens,
      strip special characters (e.g. "My AWS Post!" → "my-aws-post")
    - date: look for explicit dates in the content or frontmatter. Return null if absent.
    - tags: extract 3-7 meaningful topic tags from content (e.g. "aws", "autoscaling",
      "observability"). Lowercase, no spaces.
    - status: if URL is present assume published. If marked draft or WIP assume draft.
      If content seems internal/sensitive assume internal. Default to draft.
    - url: only include if a real external URL is explicitly mentioned in the content.

    Blog Post:
    {content}

# -----------------------------------------------------------------------------
# Reminder — daily morning notification
#
# brain remind             → send reminder now (test mode)
# brain remind --install   → generate + load launchd plist
# brain remind --uninstall → unload + remove plist
# brain remind --status    → show schedule + last run info
# -----------------------------------------------------------------------------
reminder:
  # Trigger time for launchd (24h format)
  schedule:
    hour: 9
    minute: 0

  # macOS notification content (sent via osascript)
  notification:
    title: "🧠 Brain — Daily Summary"
    message: "Drop your notes in inputs/{date}/ and run: brain compose --date {date} --ingest"
    sound: "default"   # macOS sound name, or "default"

  # Launchd plist label (used as the plist filename too)
  launchd_label: "com.brain.reminder"

  # Reminder markdown checklist template
  # {date} and {yesterday} are injected at runtime
  # ─────────────────────────────────────────────────────────────────────────────
  #
  # The three format() placeholders injected by reminder.py are:
  #   {date}             → today's date, e.g. 2026-03-11
  #   {timestamp}        → generation time, e.g. 2026-03-11 09:00:12
  #   {yesterday_status} → SQLite ingest check result for yesterday
  #
  # To apply: replace the checklist_template key under reminder: in config.yaml
  # ─────────────────────────────────────────────────────────────────────────────
  checklist_template: |
    # 🧠 Daily Brain Reminder — {date}

    **Generated at:** {timestamp}

    ---

    ## Yesterday's Status

    {yesterday_status}

    ---

    ## Today's Checklist

    ### 1. 📥 Drop Notes into inputs/{date}/

    Create the folder and drop your source files:
    ```
    mkdir -p inputs/{date}
    ```

    - [ ] `inputs/{date}/ai_summary.md` — AI-generated daily summary from your tool
    - [ ] `inputs/{date}/standup.md` — standup / team sync notes (if applicable)
    - [ ] `inputs/{date}/meetings.md` — any other meeting notes from today
    - [ ] `inputs/{date}/notes.md` — ad-hoc thoughts, decisions, links, references
    - [ ] Any other `.md` or `.txt` files you want merged into today's summary

    > 💡 You only need the files that exist — composer skips nothing, merges everything it finds.

    ---

    ### 2. 🧠 Compose + Ingest Sensitive Summary

    ```bash
    brain compose --date {date} --ingest
    ```

    This will:
    - [ ] Merge all files in `inputs/{date}/` via local LLM
    - [ ] Write structured summary → `daily/sensitive/{date}.md`
    - [ ] Extract action items → append to `todo.txt`
    - [ ] Archive inputs → `inputs/archive/{date}/`
    - [ ] Ingest into SQLite + ChromaDB automatically

    If something looks wrong, preview first without writing:
    ```bash
    brain compose --date {date} --dry-run
    ```

    ---

    ### 3. ✍️ Write + Ingest Public Summary

    Write a sanitised version of your day — safe to commit and share:
    ```
    daily/public/{date}.md
    ```

    - [ ] No internal names, domains, ticket numbers, or salary/HR details
    - [ ] Focus on: technologies used, decisions made, learning, blockers (anonymised)
    - [ ] Run the scanner to verify it's clean before committing:
          ```bash
          pre-commit run scan-public-summaries --files daily/public/{date}.md
          ```
    - [ ] Ingest the public summary:
          ```bash
          brain ingest --file daily/public/{date}.md --sensitivity public
          ```

    ---

    ### 4. 📝 Blog Post (optional)

    Did you write or update a blog post today?

    **New public post (ready to publish):**
    - [ ] File saved at: `blogs/public/{date}-<slug>.md`
    - [ ] Scanner check:
          ```bash
          pre-commit run scan-public-summaries --files blogs/public/{date}-<slug>.md
          ```
    - [ ] Ingest:
          ```bash
          brain ingest --file blogs/public/{date}-<slug>.md --sensitivity public
          ```

    **Draft / sensitive post (internal context, not for sharing):**
    - [ ] File saved at: `blogs/sensitive/{date}-<slug>-draft.md`
    - [ ] Ingest:
          ```bash
          brain ingest --file blogs/sensitive/{date}-<slug>-draft.md --sensitivity sensitive
          ```

    > 💡 Blog posts are auto-detected by path — the ingest pipeline routes them
    > to `blog_public` / `blog_sensitive` ChromaDB collections automatically.

    ---

    ### 5. 🔍 Verify Everything is Ingested

    ```bash
    brain status --detailed
    ```

    - [ ] `{date}` shows `✅ up to date` for all files you created today
    - [ ] No `⚠️ needs ingest` warnings for today's date

    ---

    ### 6. 💾 Commit Public Summaries

    ```bash
    git add daily/public/{date}.md
    git add blogs/public/                    # if you wrote a blog post today
    git add exports/public/                  # if you ran --export on any command
    git commit -m "data: daily summary {date}"
    ```

    - [ ] Pre-commit hooks pass (ruff + detect-secrets + public scanner)
    - [ ] Only public files are staged — check `git status` before committing

    ---

    ### 7. ✅ Review Action Items

    ```bash
    # View today's extracted action items
    grep -A 20 "^# {date}" todo.txt
    ```

    Or open the dashboard and check the Action Items tab:
    ```bash
    brain dashboard
    ```

    - [ ] Review (A) priority items — urgent, do today
    - [ ] Review (B) priority items — schedule for this week
    - [ ] Review (C) priority items — backlog

    ### 8. ✅ sync plans and chats
    - [ ] Sync Plans
    - [ ] Export Chats

    ---

    ## Quick Reference

    | Command | What it does |
    |---|---|
    | `brain compose --date {date} --ingest` | Full compose + ingest in one step |
    | `brain ingest --file PATH --sensitivity S` | Ingest a single file |
    | `brain status --detailed` | Disk vs store breakdown |
    | `brain query "..."` | Ask your brain anything |
    | `brain trend --field sentiment` | Mood trends over time |
    | `brain dashboard` | Open browser dashboard |
    | `uv run python scripts/reindex.py` | Catch up on missed dates |

    ---

    *This file is auto-generated by `brain remind`. Safe to delete after use.*
    *Saved to: exports/reminders/{date}_reminder.md*

# -----------------------------------------------------------------------------
# Anonymizer — redacts sensitive data for safe debugging / sharing
#
# Usage:
#   python scripts/anonymize.py path/to/file.md
#   python scripts/anonymize.py daily/sensitive/2026-02-24.md
#
# Output: anonymized content printed to stdout only — no files written.
# -----------------------------------------------------------------------------
anonymizer:

  # People map — real name → replacement alias
  # Add your own names here. Order matters — longer/full names first
  # to avoid partial replacements (e.g. "FirstName Lastname" before "FirstName")
  people:
    # Add more as needed:
    # "First Last": "Person_F"

  # Internal URL patterns — replaced with [INTERNAL_URL]
  # Add your org-specific domains here
  internal_url_patterns:
    - "https?://[a-zA-Z0-9._-]*\\.atlassian\\.net[^\\s]*"
    - "https?://[a-zA-Z0-9._-]*\\.slack\\.com[^\\s]*"
    - "https?://[a-zA-Z0-9._-]*\\.internal[^\\s]*"
    - "https?://[a-zA-Z0-9._-]*stage\\.[^\\s]*"
    - "https?://[a-zA-Z0-9._-]*prod[0-9]*[.-][^\\s]*"
    - "https?://github\\.com/[a-zA-Z0-9_-]+/[^\\s]*"   # any github org/repo

  # AWS account IDs — 12-digit numbers replaced with [AWS_ACCOUNT_ID]
  aws_account_id_pattern: "\\b[0-9]{12}\\b"

  # AWS access key IDs — replaced with [AWS_KEY_ID]
  aws_key_pattern: "AKIA[0-9A-Z]{16}"

  # AWS ARNs — replaced with [AWS_ARN]
  aws_arn_pattern: "arn:aws:[a-zA-Z0-9\\-]+:[a-zA-Z0-9\\-]*:[0-9]{12}[^\\s]*"

  # Generic secret patterns — replaced with [REDACTED]
  secret_patterns:
    - "(?i)(password|passwd|pwd)\\s*[=:]\\s*\\S+"
    - "(?i)(api[_-]?key|apikey)\\s*[=:]\\s*\\S+"
    - "(?i)(secret|token|credential)\\s*[=:]\\s*['\"]?\\w{8,}['\"]?"
    - "(?i)bearer\\s+[a-zA-Z0-9\\-_.]{20,}"

  # Internal IP addresses — replaced with [INTERNAL_IP]
  ip_patterns:
    - "\\b10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}\\b"
    - "\\b172\\.(1[6-9]|2[0-9]|3[01])\\.\\d{1,3}\\.\\d{1,3}\\b"
    - "\\b192\\.168\\.\\d{1,3}\\.\\d{1,3}\\b"

  # Internal hostnames — replaced with [INTERNAL_HOST]
  hostname_patterns:
    - "[a-zA-Z0-9-]+\\.internal\\b"
    - "[a-zA-Z0-9-]+\\.corp\\.[a-zA-Z]+"
    - "prod[0-9]+-[a-zA-Z0-9-]+\\.[a-zA-Z]+"   # e.g. prod1-www5.example.com

  # Absolute local paths in stacktraces — replaced with [LOCAL_PATH]
  # e.g. /Users/rahul/projects/brain/src → [LOCAL_PATH]/src
  local_path_pattern: "/(?:Users|home)/[a-zA-Z0-9._-]+/[^\\s]*"

