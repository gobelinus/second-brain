# Pre-commit hook configuration for Brain
# Run manually: uv run pre-commit run --all-files
# Installed as git hook: uv run pre-commit install

repos:
  # ── Ruff — linting and formatting ─────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      - id: ruff-format
        name: "ruff › format"
        description: "Auto-format Python files"

      - id: ruff
        name: "ruff › lint"
        description: "Lint Python files, auto-fix where safe"
        args: [--fix, --exit-non-zero-on-fix]

  # ── detect-secrets — credential scanning ──────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: "security › detect secrets"
        description: "Scan for accidentally committed secrets or keys"
        args:
          - --baseline
          - .secrets.baseline
        exclude: |
          (?x)^(
            .secrets.baseline|
            daily/sensitive/.*|
            store/.*|
            .venv/.*|
            uv.lock
          )$

  # ── Custom — sensitive content in public summaries ─────────────────────────
  - repo: local
    hooks:
      - id: scan-public-summaries
        name: "security › scan public summaries"
        description: "Detect sensitive content in public daily summaries"
        language: python
        entry: python scripts/scan_public_summaries.py
        files: ^daily/public/.*\.md$
        pass_filenames: true

  # ── General hygiene ────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: "hygiene › trailing whitespace"

      - id: end-of-file-fixer
        name: "hygiene › end of file"

      - id: check-yaml
        name: "hygiene › valid yaml"

      - id: check-merge-conflict
        name: "hygiene › merge conflicts"

      - id: check-added-large-files
        name: "hygiene › large files"
        args: [--maxkb=500]
